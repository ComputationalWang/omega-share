[workspace]
resolver = "3"
members = ["apps/server-rs"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

# No panics reachable from input (ADR 0050): every fallible step returns a Result the caller handles.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
exit = "deny"
string_slice = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
