schema: paperclip/v1
agents:
  ceo:
    adapter:
      type: claude_local
      config:
        engine: cli
        model: claude-opus-5-5
        effort: medium
        dangerouslySkipPermissions: true
        cwd: /home/wang/Projects/omega-share
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 1800
        maxConcurrentRuns: 1
        wakeOnDemand: true
        skipTimerWhenNoActionableWork: true
    permissions:
      canCreateAgents: false
