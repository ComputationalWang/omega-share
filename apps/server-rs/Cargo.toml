[package]
name = "omega-server"
version = "0.1.0"
description = "omega-share server: rooms, sync relay and share API (ADR 0050)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "omega-server"
path = "src/main.rs"

[features]
# Test-only control endpoints (virtual clock, ADR 0050). Never in a release build: CI checks the binary.
test-hooks = []

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
icu_properties = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
unicode-normalization = "0.1"
getrandom = "0.4"
sha2 = "0.10"
subtle = "2"
url = "2.5.8"
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
