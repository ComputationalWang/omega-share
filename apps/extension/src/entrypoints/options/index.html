<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>omega share settings</title>
    <meta name="manifest.open_in_tab" content="false" />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
      form { display: grid; gap: 8px; max-width: 420px; }
      input { font: inherit; padding: 4px; }
      [data-state="error"] { color: #b00020; }
      [data-state="ok"] { color: #1b5e20; }
    </style>
  </head>
  <body>
    <form id="form">
      <label for="url">Server URL</label>
      <input id="url" data-testid="server-url-input" type="url" required placeholder="http://localhost:8787" />
      <button type="submit" data-testid="server-url-save">Save</button>
      <p id="status" data-testid="server-url-status" role="status"></p>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
