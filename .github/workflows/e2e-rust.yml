# CI e2e against the Rust server (OME-1170, ADR 0050): the same deterministic lanes as e2e.yml with E2E_SERVER=rust,
# only on PRs that touch apps/server-rs (a path-filtered workflow, so not a required check). No report merge: failures
# show in the shard logs and the uploaded traces.
name: e2e-rust

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/server-rs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "e2e/support/server-cmd.ts"
      - ".github/workflows/e2e-rust.yml"

permissions:
  contents: read

concurrency:
  group: e2e-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Same cache as check.yml (rustup is on the runner and installs the rust-toolchain.toml pin).
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium system deps
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run --filter @omega/extension build:e2e
      # playwright.config.ts builds the e2e-profile omega-server once (the runner), then every spec talks to it.
      - name: Playwright shard ${{ matrix.shard }}/4 against the Rust server
        env:
          E2E_SERVER: rust
        run: bunx playwright test --project=e2e --project=e2e-sync --project=e2e-tunnel --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: rust-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7
