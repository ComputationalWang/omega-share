#!/usr/sbin/nft -f
# Host firewall behind the Hetzner firewall (ADR 0020): only SSH, HTTP and HTTPS, and a cap
# on concurrent connections per source address (/64 for IPv6).
flush ruleset

table inet filter {
	set ssh_meter4 { type ipv4_addr; flags dynamic, timeout; timeout 5m; size 65535; }
	set ssh_meter6 { type ipv6_addr; flags dynamic, timeout; timeout 5m; size 65535; }
	# ct count sets free an entry when its last connection closes, and can't take a timeout.
	set web_conn4 { type ipv4_addr; flags dynamic; size 65535; }
	set web_conn6 { type ipv6_addr; flags dynamic; size 65535; }

	chain input {
		type filter hook input priority 0; policy drop;
		iif lo accept
		ct state invalid drop
		ct state established,related accept
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept
		tcp dport 22 ct state new add @ssh_meter4 { ip saddr limit rate 10/minute burst 20 packets } accept
		tcp dport 22 ct state new add @ssh_meter6 { ip6 saddr and ffff:ffff:ffff:ffff:: limit rate 10/minute burst 20 packets } accept
		tcp dport { 80, 443 } ct state new add @web_conn4 { ip saddr ct count over 64 } reject with tcp reset
		tcp dport { 80, 443 } ct state new add @web_conn6 { ip6 saddr and ffff:ffff:ffff:ffff:: ct count over 64 } reject with tcp reset
		tcp dport { 80, 443 } ct state new accept
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
