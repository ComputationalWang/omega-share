# Installed by provision.sh into /etc/systemd/journald.conf.d/ (OME-386, ADR 0020 §3).
# The journal is persistent. Caddy and the app log no client IPs, but sshd logs the peer of every
# SSH connection: drop entries after 14 days.
# Rotation (OME-504): the server's error lines (stderr, JSON) and Caddy's go here too. Files rotate daily
# or at 32 MB, and the whole journal stays under 256 MB on the CAX11's disk.
[Journal]
MaxRetentionSec=14day
SystemMaxUse=256M
SystemMaxFileSize=32M
MaxFileSec=1day
